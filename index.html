            const today = getTodayString();

            let todayHtml = '<div class="section-title">✨ 오늘의 전달사항</div>';
            let pastHtml = '<div class="section-divider"></div><div class="section-title">📅 이전 전달사항</div>';
            let hasToday = false, hasPast = false;

            const safeList = Array.isArray(list) ? [...list].reverse() : [];
            safeList.forEach(item => {
                const id = String(item?.전달ID ?? '').trim();
                const dateStr = String(item?.날짜 ?? '').trim();
                const rawContent = String(item?.내용 ?? '');
                if (!id && !rawContent) return;

                noticeMap.set(id, { id, date: dateStr, content: rawContent });

                const isToday = dateStr === today;
                const safeIdAttr = escapeHtml(id);
                const safeContentHtml = escapeHtml(rawContent).replace(/\n/g, '<br>');

                const itemHtml = `
                    <div class="notice-item ${isToday ? 'today' : 'past'}">
                        <span class="notice-time">${isToday ? '오늘' : escapeHtml(dateStr)}</span>
                        <div class="notice-text">${safeContentHtml}</div>
                        <div style="position:absolute; top:11px; right:10px; display:flex; gap:4px;">
                            <button type="button" class="action-btn edit-btn" onclick="openEditModal('${safeIdAttr}')" title="수정">${SVG_EDIT}</button>
                            <button type="button" class="action-btn delete-btn" onclick="deleteNotice('${safeIdAttr}')" title="삭제">${SVG_DELETE}</button>
                        </div>
                    </div>`;

                if (isToday) { todayHtml += itemHtml; hasToday = true; }
                else { pastHtml += itemHtml; hasPast = true; }
            });

            if (!hasToday) {
                todayHtml += '<div style="text-align:center; padding:10px; color:var(--text-sub); font-size:0.85rem;">오늘 등록된 전달사항이 없습니다.</div>';
            }
            if (!hasPast) {
                pastHtml += '<div style="text-align:center; padding:10px; color:var(--text-sub); font-size:0.85rem;">이전 전달사항이 없습니다.</div>';
            }

            board.innerHTML = todayHtml + pastHtml;
            filterNotices();
        }

        async function fetchNotices() {
            const board = document.getElementById('noticeBoard');
            if (IS_LOCAL_MODE) {
                renderNotices(getLocalNotices());
                return;
            }
            try {
                const data = await apiGet({ type: 'notice' });
                renderNotices(Array.isArray(data) ? data : (data.items || []));
            } catch (e) {
                board.innerHTML = '<div style="text-align:center; padding:20px; color:var(--accent-red); font-size:0.9rem;">전달사항 로딩 실패 (네트워크·Apps Script 확인)</div>';
            }
        }

        function checkEnter(e) {
            if (e.isComposing || e.keyCode === 229) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                postNotice();
            }
        }

        async function postNotice() {
            if (isPostingNotice) return;
            const input = document.getElementById('noticeInput');
            const btn = document.getElementById('postNoticeBtn');
            const val = input.value.trim();
            if (!val) { showToast('내용을 입력해주세요.', true); return; }

            if (IS_LOCAL_MODE) {
                const list = getLocalNotices();
                list.push({ 전달ID: 'N-' + Date.now(), 날짜: getTodayString(), 내용: val });
                setLocalNotices(list);
                input.value = '';
                showToast('전달사항이 등록되었습니다. (테스트 모드)');
                renderNotices(list);
                return;
            }

            isPostingNotice = true;
            btn.disabled = true;
            btn.textContent = '저장중';
            try {
                const res = await apiPost({ action: 'create', type: 'notice', text: val });
                input.value = '';
                showToast('전달사항이 등록되었습니다.');
                if (Array.isArray(res.items)) renderNotices(res.items);
                else await fetchNotices();
            } catch (e) {
                showToast('등록 실패: ' + e.message, true);
            } finally {
                isPostingNotice = false;
                btn.disabled = false;
                btn.textContent = '등록';
            }
        }

        let currentEditId = null;
        function openEditModal(id) {
            const item = noticeMap.get(id);
            if (!item) return;
            currentEditId = id;
            document.getElementById('editModalInput').value = item.content;
            document.getElementById('editModal').style.display = 'flex';
            setTimeout(() => document.getElementById('editModalInput').focus(), 30);
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditId = null;
        }

        async function saveEdit() {
            if (isSavingEdit || !currentEditId) return;
            const val = document.getElementById('editModalInput').value.trim();
            const btn = document.getElementById('saveNoticeEditBtn');
            if (!val) { showToast('내용을 입력해주세요.', true); return; }

            if (IS_LOCAL_MODE) {
                const list = getLocalNotices().map(it => it.전달ID === currentEditId ? { ...it, 내용: val } : it);
                setLocalNotices(list);
                closeEditModal();
                showToast('수정되었습니다. (테스트 모드)');
                renderNotices(list);
                return;
            }

            isSavingEdit = true;
            btn.disabled = true;
            btn.textContent = '저장중...';
            try {
                const res = await apiPost({ action: 'update', type: 'notice', id: currentEditId, text: val });
                closeEditModal();
                showToast('수정되었습니다.');
                if (Array.isArray(res.items)) renderNotices(res.items);
                else await fetchNotices();
            } catch (e) {
                showToast('수정 실패: ' + e.message, true);
            } finally {
                isSavingEdit = false;
                btn.disabled = false;
                btn.textContent = '저장';
            }
        }

        async function deleteNotice(id) {
            if (!confirm('이 전달사항을 삭제하시겠습니까?')) return;
            if (IS_LOCAL_MODE) {
                const list = getLocalNotices().filter(it => it.전달ID !== id);
                setLocalNotices(list);
                showToast('삭제되었습니다.');
                renderNotices(list);
                return;
            }
            try {
                const res = await apiPost({ action: 'delete', type: 'notice', id });
                showToast('삭제되었습니다.');
                if (Array.isArray(res.items)) renderNotices(res.items);
                else await fetchNotices();
            } catch (e) {
                showToast('삭제 실패: ' + e.message, true);
            }
        }

        // =========================================
        // 8. 주요 업무 D-Day (반별 체크 & 보관함)
        // =========================================
        function filterDdays() {
            const query = document.getElementById('ddaySearch').value.toLowerCase();
            let archiveHasMatch = false;

            document.querySelectorAll('.d-day-box').forEach(item => {
                const isMatch = item.textContent.toLowerCase().includes(query);
                item.style.display = isMatch ? 'flex' : 'none';
                if (isMatch && item.classList.contains('archived')) archiveHasMatch = true;
            });

            const archiveSection = document.querySelector('details.archive-section');
            if (archiveSection) {
                if (query !== '') {
                    archiveSection.style.display = archiveHasMatch ? 'block' : 'none';
                    archiveSection.open = archiveHasMatch;
                } else {
                    archiveSection.style.display = 'block';
                    archiveSection.open = false;
                }
            }
        }

        function renderDdays(list) {
            ddayMap.clear();
            const safeList = Array.isArray(list) ? list : [];
            safeList.forEach(item => {
                const id = String(item?.ID ?? '').trim();
                const name = String(item?.일정명 ?? '').trim();
                const dateStr = String(item?.날짜 ?? '').trim();
                if (!id || !name || !dateStr) return;
                ddayMap.set(id, {
                    id,
                    name,
                    date: dateStr,
                    link: String(item?.외부링크 ?? '').trim(),
                    fileLink: String(item?.파일링크 ?? '').trim(),
                    checkStr: String(item?.반별체크 ?? '').trim(),
                    archived: String(item?.보관여부 ?? '').trim().toUpperCase() === 'Y'
                });
            });
            renderDdaysFromMap();
        }

        function renderDdaysFromMap() {
            const activeList = document.getElementById('activeDdayList');
            const archivedContainer = document.getElementById('archivedDdayContainer');
            const daysArr = ['일', '월', '화', '수', '목', '금', '토'];
            const todayDate = parseLocalDate(getTodayString());
            const classCount = Math.max(1, Math.min(20, Number(appConfig.classCount) || 8));

            const sorted = Array.from(ddayMap.values()).sort((a, b) => {
                const da = parseLocalDate(a.date);
                const db = parseLocalDate(b.date);
                return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
            });

            let activeHtml = '';
            let archivedHtml = '';
            let archiveCount = 0;

            sorted.forEach(item => {
                const targetDate = parseLocalDate(item.date);
                if (!targetDate) return;

                const diff = Math.round((targetDate - todayDate) / (1000 * 60 * 60 * 24));
                const dText = diff > 0 ? `D-${diff}` : (diff === 0 ? 'D-Day' : `D+${Math.abs(diff)}`);
                const isTodayClass = diff === 0 ? 'dday-today' : '';
                const dayStr = daysArr[targetDate.getDay()];
                const shortDate = formatShortDate(targetDate);

                const safeIdAttr = escapeHtml(item.id);
                const safeName = escapeHtml(item.name);
                const safeLinkHref = normalizeUrl(item.link);
                const safeFileHref = normalizeUrl(item.fileLink);

                const linkBadge = safeLinkHref
                    ? `<a href="${escapeHtml(safeLinkHref)}" target="_blank" rel="noopener noreferrer" style="margin-right:6px; display:flex; align-items:center; text-decoration:none;" title="링크 바로가기"><span class="badge-link">링크</span></a>`
                    : '';
                const fileBadge = safeFileHref
                    ? `<a href="${escapeHtml(safeFileHref)}" target="_blank" rel="noopener noreferrer" style="margin-right:8px; display:flex; align-items:center; text-decoration:none;" title="첨부파일 다운로드"><span class="badge-file">파일</span></a>`
                    : '';

                let classCheckHtml = '';
                if (item.checkStr) {
                    const checks = safeJsonParse(item.checkStr, null);
                    if (Array.isArray(checks)) {
                        let btns = '';
                        for (let c = 0; c < classCount; c++) {
                            const isOn = Number(checks[c]) === 1;
                            btns += `<button type="button" class="class-btn ${isOn ? 'on' : 'off'}" onclick="toggleCheck('${safeIdAttr}', ${c}, this)">${c + 1}</button>`;
                        }
                        classCheckHtml = `<div class="class-check-wrap">${btns}</div>`;
                    }
                }

                const innerHtml = `
                    <div class="d-day-row" style="display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px;">
                        <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-grow:1; min-width:0;" title="${safeName}">
                            ${safeName} <span style="font-size:0.82rem; color:var(--text-sub);">(${shortDate} ${dayStr})</span>
                        </div>
                        <div class="d-day-actions">
                            ${linkBadge}${fileBadge}
                            ${!item.archived ? `<span class="accent-text">${dText}</span>` : ''}
                            <button type="button" class="action-btn archive-btn" onclick="toggleArchive('${safeIdAttr}')" title="${item.archived ? '보관함에서 꺼내기' : '보관함으로 이동'}">${item.archived ? SVG_RESTORE : SVG_ARCHIVE}</button>
                            ${!item.archived ? `<button type="button" class="action-btn edit-btn" onclick="openDdayModal('edit', '${safeIdAttr}')" title="수정">${SVG_EDIT}</button>` : ''}
                            <button type="button" class="action-btn delete-btn" onclick="deleteDday('${safeIdAttr}')" title="${item.archived ? '영구 삭제' : '삭제'}">${SVG_DELETE}</button>
                        </div>
                    </div>
                    ${!item.archived ? classCheckHtml : ''}`;

                if (item.archived) {
                    archiveCount++;
                    archivedHtml += `<div class="d-day-box archived">${innerHtml}</div>`;
                } else {
                    activeHtml += `<div class="d-day-box ${isTodayClass}">${innerHtml}</div>`;
                }
            });

            if (!activeHtml) {
                activeHtml = '<div style="text-align:center; padding:20px; color:var(--text-sub); font-size:0.9rem;">예정된 업무가 없습니다. 🎉</div>';
            }

            activeList.innerHTML = activeHtml;
            archivedContainer.innerHTML = archiveCount > 0
                ? `<details class="archive-section"><summary>🗃️ 완료된 업무 보관함 (${archiveCount}개)</summary><div class="archive-content">${archivedHtml}</div></details>`
                : '';

            filterDdays();
        }

        async function fetchDdays() {
            const activeList = document.getElementById('activeDdayList');
            if (IS_LOCAL_MODE) {
                renderDdays(getLocalDdays());
                return;
            }
            try {
                const data = await apiGet({ type: 'dday' });
                renderDdays(Array.isArray(data) ? data : (data.items || []));
            } catch (e) {
                activeList.innerHTML = '<div style="text-align:center; padding:20px; color:var(--accent-red); font-size:0.9rem;">D-Day 로딩 실패 (네트워크·Apps Script 확인)</div>';
            }
        }

        async function toggleCheck(id, classIndex, btn) {
            const wasOn = btn.classList.contains('on');
            btn.classList.toggle('on', !wasOn);
            btn.classList.toggle('off', wasOn);

            const classCount = Math.max(1, Math.min(20, Number(appConfig.classCount) || 8));

            if (IS_LOCAL_MODE) {
                const list = getLocalDdays().map(it => {
                    if (it.ID !== id) return it;
                    const arr = safeJsonParse(it.반별체크, []);
                    while (arr.length < classCount) arr.push(0);
                    arr[classIndex] = wasOn ? 0 : 1;
                    return { ...it, 반별체크: JSON.stringify(arr) };
                });
                setLocalDdays(list);
                const cached = ddayMap.get(id);
                if (cached) {
                    const updated = list.find(x => x.ID === id);
                    if (updated) cached.checkStr = updated.반별체크;
                }
                return;
            }

            try {
                await apiPost({ action: 'toggleCheck', type: 'dday', id, classIndex, classCount });
            } catch (e) {
                btn.classList.toggle('on', wasOn);
                btn.classList.toggle('off', !wasOn);
                showToast('체크 저장 실패: ' + e.message, true);
            }
        }

        async function toggleArchive(id) {
            if (IS_LOCAL_MODE) {
                const list = getLocalDdays().map(it => it.ID === id ? { ...it, 보관여부: it.보관여부 === 'Y' ? 'N' : 'Y' } : it);
                setLocalDdays(list);
                showToast('보관함 상태가 변경되었습니다.');
                renderDdays(list);
                return;
            }
            try {
                const res = await apiPost({ action: 'toggleArchive', type: 'dday', id });
                showToast('보관함 상태가 변경되었습니다.');
                if (Array.isArray(res.items)) renderDdays(res.items);
                else await fetchDdays();
            } catch (e) {
                showToast('상태 변경 실패: ' + e.message, true);
            }
        }

        let ddayModalMode = 'add';
        let currentDdayEditId = null;

        function openDdayModal(mode, id = null) {
            ddayModalMode = mode;
            const titleSpan = document.querySelector('#ddayModalTitle span');
            const btn = document.getElementById('saveDdayBtn');
            btn.disabled = false;

            if (mode === 'add') {
                titleSpan.textContent = '새로운 D-Day 추가';
                btn.textContent = '추가하기';
                currentDdayEditId = null;
                document.getElementById('modalDdayName').value = '';
                document.getElementById('modalDdayDate').value = getTodayString();
                document.getElementById('modalDdayLink').value = '';
                document.getElementById('modalDdayFile').value = '';
                document.getElementById('modalDdayNeedsCheck').checked = false;
                document.getElementById('ddayFileHint').style.display = 'none';
            } else {
                const item = ddayMap.get(id);
                if (!item) return;
                titleSpan.textContent = 'D-Day 수정';
                btn.textContent = '저장하기';
                currentDdayEditId = id;
                document.getElementById('modalDdayName').value = item.name;
                document.getElementById('modalDdayDate').value = item.date.slice(0, 10);
                document.getElementById('modalDdayLink').value = item.link || '';
                document.getElementById('modalDdayFile').value = '';
                document.getElementById('modalDdayNeedsCheck').checked = Boolean(item.checkStr);
                document.getElementById('ddayFileHint').style.display = 'block';
            }
            document.getElementById('ddayModal').style.display = 'flex';
            setTimeout(() => document.getElementById('modalDdayName').focus(), 30);
        }

        function closeDdayModal() {
            document.getElementById('ddayModal').style.display = 'none';
            currentDdayEditId = null;
        }

        function processDdaySave() {
            const name = document.getElementById('modalDdayName').value.trim();
            const date = document.getElementById('modalDdayDate').value;
            const rawLink = document.getElementById('modalDdayLink').value.trim();
            const link = rawLink ? normalizeUrl(rawLink) : '';
            const fileInput = document.getElementById('modalDdayFile');
            const needsCheck = document.getElementById('modalDdayNeedsCheck').checked;
            const btn = document.getElementById('saveDdayBtn');
            const defaultLabel = ddayModalMode === 'add' ? '추가하기' : '저장하기';

            if (!name || !date) { showToast('일정명과 날짜를 입력해주세요.', true); return; }
            if (rawLink && !link) { showToast('올바른 링크 형식이 아닙니다.', true); return; }

            if (IS_LOCAL_MODE) {
                if (fileInput.files.length > 0) {
                    showToast('파일 첨부는 구글 시트(Apps Script) 연동 후 사용할 수 있습니다.', true);
                }
                const classCount = Math.max(1, Math.min(20, Number(appConfig.classCount) || 8));
                let list = getLocalDdays();
                if (ddayModalMode === 'add') {
                    list.push({
                        ID: 'D-' + Date.now(),
                        일정명: name,
                        날짜: date,
                        외부링크: link,
                        파일링크: '',
                        반별체크: needsCheck ? JSON.stringify(new Array(classCount).fill(0)) : '',
                        보관여부: 'N'
                    });
                } else {
                    list = list.map(it => {
                        if (it.ID !== currentDdayEditId) return it;
                        let checkStr = it.반별체크 || '';
                        if (needsCheck && !checkStr) checkStr = JSON.stringify(new Array(classCount).fill(0));
                        if (!needsCheck) checkStr = '';
                        return { ...it, 일정명: name, 날짜: date, 외부링크: link, 반별체크: checkStr };
                    });
                }
                setLocalDdays(list);
                closeDdayModal();
                showToast(ddayModalMode === 'add' ? '일정이 추가되었습니다. (테스트 모드)' : '일정이 수정되었습니다. (테스트 모드)');
                renderDdays(list);
                return;
            }

            btn.textContent = '처리중...';
            btn.disabled = true;

            const payload = {
                action: ddayModalMode === 'add' ? 'create' : 'update',
                type: 'dday',
                name,
                date,
                link,
                needsCheck,
                classCount: Math.max(1, Math.min(20, Number(appConfig.classCount) || 8))
            };
            if (ddayModalMode === 'edit') payload.id = currentDdayEditId;

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if (file.size > 5 * 1024 * 1024) {
                    showToast('첨부파일은 5MB 이하만 가능합니다.', true);
                    btn.textContent = defaultLabel;
                    btn.disabled = false;
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    payload.fileData = e.target.result.split(',')[1];
                    payload.fileName = file.name;
                    payload.mimeType = file.type;
                    sendDdayRequest(payload, btn, defaultLabel);
                };
                reader.onerror = () => {
                    showToast('파일을 읽는 중 오류가 발생했습니다.', true);
                    btn.textContent = defaultLabel;
                    btn.disabled = false;
                };
                reader.readAsDataURL(file);
            } else {
                sendDdayRequest(payload, btn, defaultLabel);
            }
        }

        async function sendDdayRequest(payload, btn, defaultLabel) {
            try {
                const res = await apiPost(payload);
                closeDdayModal();
                showToast(ddayModalMode === 'add' ? '일정이 추가되었습니다.' : '일정이 수정되었습니다.');
                if (Array.isArray(res.items)) renderDdays(res.items);
                else await fetchDdays();
            } catch (e) {
                showToast('저장 실패: ' + e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = defaultLabel;
            }
        }

        async function deleteDday(id) {
            if (!confirm('해당 D-Day를 영구 삭제하시겠습니까?')) return;
            if (IS_LOCAL_MODE) {
                const list = getLocalDdays().filter(it => it.ID !== id);
                setLocalDdays(list);
                showToast('삭제되었습니다.');
                renderDdays(list);
                return;
            }
            try {
                const res = await apiPost({ action: 'delete', type: 'dday', id });
                showToast('삭제되었습니다.');
                if (Array.isArray(res.items)) renderDdays(res.items);
                else await fetchDdays();
            } catch (e) {
                showToast('삭제 실패: ' + e.message, true);
            }
        }

        // =========================================
        // 9. 초기화 실행
        // =========================================
        document.addEventListener('DOMContentLoaded', async () => {
            applyTheme(localStorage.getItem(STORAGE_KEYS.THEME) || 'dark');

            if (IS_LOCAL_MODE) {
                document.getElementById('testModeBadge').classList.add('visible');
            }

            const savedMemo = localStorage.getItem(STORAGE_KEYS.MEMO);
            if (savedMemo !== null) document.getElementById('privateMemo').value = savedMemo;
            document.getElementById('privateMemo').addEventListener('input', (e) => {
                localStorage.setItem(STORAGE_KEYS.MEMO, e.target.value);
            });

            renderChecklist();
            applyConfigToUI();
            selectMealType(getAutoMealType(), false);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeEditModal();
                    closeDdayModal();
                }
            });

            await loadRemoteConfig();
            fetchWeather();
            fetchMeals();
            fetchNotices();
            fetchDdays();

            setInterval(updateTime, 1000);
            setInterval(() => {
                fetchNotices();
                fetchDdays();
                loadRemoteConfig();
            }, 5 * 60 * 1000);
            setInterval(fetchWeather, 30 * 60 * 1000);
        });
    </script>
</body>
